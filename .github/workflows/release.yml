name: release
on:
  push:
    # main = 当前大版本；<major>.x = 旧大版本的长期维护分支（如 1.x）
    #
    # 注意：push 触发的 workflow 用的是**被推分支上的那份文件**。所以这个文件必须同时
    # 存在于每一条维护分支上，否则往 1.x 推什么都不会发生。
    branches:
      - main
      - "[0-9]+.x"

  # 手动补发。push 触发偶尔会丢：2.4.1 合进 main 之后 GitHub 没有为那次 push 产生
  # 任何 workflow（release 与 deploy-docs 一起没跑），版本就卡在了仓库里发不出去。
  # 这个任务本身是幂等的 —— tag 或 npm 上已有该版本都会跳过 —— 所以随手重跑没有风险。
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取版本号、决定 dist-tag 并检查 tag
        id: ver
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          MAJOR=${VERSION%%.*}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # dist-tag：main 发 latest；维护分支发 legacy-<major>，绝不能抢走 latest，
          # 否则一次维护版发布会让所有人的 `npm i` 退回旧大版本。
          #
          # 维护分支的 tag 名不能取成 `v2` / `2` / `2.x` 这类 —— npm 会拒绝任何能被解析成
          # semver 范围的 dist-tag（报 "Tag name must not be a valid SemVer range"），实测踩过。
          # 装旧线也不依赖 dist-tag：`npm i @hsu-react/ui@1` 走的是 semver。
          if [ "$BRANCH" = "main" ]; then
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "latest_flag=--latest" >> "$GITHUB_OUTPUT"
          else
            BRANCH_MAJOR=${BRANCH%%.x}
            if [ "$MAJOR" != "$BRANCH_MAJOR" ]; then
              echo "::error::分支 $BRANCH 上的版本号是 $VERSION，大版本对不上。维护分支只能发 ${BRANCH_MAJOR}.x.x"
              exit 1
            fi
            echo "dist_tag=legacy-$MAJOR" >> "$GITHUB_OUTPUT"
            # 维护分支的 Release 不该顶掉仓库首页显示的 "Latest"
            echo "latest_flag=--latest=false" >> "$GITHUB_OUTPUT"
          fi

          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag $TAG 已存在，跳过发布"
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: 检查 npm 上是否已存在该版本
        if: steps.ver.outputs.skip != 'true'
        id: npmver
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION 已在 npm 上，跳过 publish"
          fi

      # 用 Node 自带的 corepack，而不是第三方 action：pnpm 版本由 package.json 的
      # packageManager 字段决定，本地和 CI 必然一致，发布链路也不多一个信任源。
      # 必须放在 setup-node 之后 —— shim 装在当前生效的 Node bin 下，先装会被覆盖掉。
      - name: 启用 corepack（pnpm）
        if: steps.ver.outputs.skip != 'true' && steps.npmver.outputs.published != 'true'
        run: corepack enable

      - name: 安装依赖（publish 时 prepublishOnly 自动构建）
        if: steps.ver.outputs.skip != 'true' && steps.npmver.outputs.published != 'true'
        run: pnpm install --frozen-lockfile

      - name: 发布 npm
        if: steps.ver.outputs.skip != 'true' && steps.npmver.outputs.published != 'true'
        run: npm publish --access public --tag "${{ steps.ver.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 打 tag 并生成 Release
        if: steps.ver.outputs.skip != 'true'
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            --target "${{ github.ref_name }}" \
            "${{ steps.ver.outputs.latest_flag }}"
        env:
          GH_TOKEN: ${{ github.token }}

      # 发布任务成功还不足以保证 registry 已能解析新版本。保留明确的版本与校验值，
      # 也方便区分发布失败和地区缓存传播延迟；已有 tag 的幂等重跑同样检查。
      - name: 确认 npm 版本与发布包校验值
        run: |
          NPM_VERSION_PATH=$(node -p "require('./package.json').name.replace('/', '%2F') + '/' + require('./package.json').version")
          # 查询单版本 endpoint，避免整包元数据缓存仍指向上一版；传播期间限次重试。
          curl --fail --silent --show-error --retry 40 --retry-all-errors --retry-delay 15 --retry-max-time 600 --max-time 15 --connect-timeout 5 \
            "https://registry.npmjs.org/$NPM_VERSION_PATH" -o "$RUNNER_TEMP/npm-release.json"
          node - "$RUNNER_TEMP/npm-release.json" <<'NODE'
          const fs = require('node:fs');
          const expected = require('./package.json');
          const published = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (published.name !== expected.name || published.version !== expected.version || !published.dist?.integrity) {
            throw new Error('Registry version or integrity does not match the release');
          }
          console.log(JSON.stringify({ name: published.name, version: published.version, dist: published.dist }, null, 2));
          NODE
